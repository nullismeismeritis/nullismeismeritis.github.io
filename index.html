<!DOCTYPE html>
<html>
  <head>
     <script type="application/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/showdown/1.9.0/showdown.min.js"></script>
     <script type="application/javascript" src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
     <style>
       body {
         font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
         line-height: 1.6;
         color: #333;
         background-color: #f4f4f4;
         margin: 0;
         padding: 0;
       }
       #rendered {
         max-width: 800px;
         margin: 0 auto;
         padding: 20px;
         background-color: #fff;
         box-shadow: 0 0 10px rgba(0,0,0,0.1);
         border-radius: 8px;
         margin-top: 20px;
       }
       h1, h2, h3, h4, h5, h6 {
         color: #2c3e50;
         margin-bottom: 10px;
       }
       p {
         margin-bottom: 15px;
       }
       a {
         color: #3498db;
         text-decoration: none;
       }
       a:hover {
         text-decoration: underline;
       }
       code {
         background-color: #f8f8f8;
         padding: 2px 4px;
         border-radius: 4px;
         font-family: 'Courier New', monospace;
       }
       pre {
         background-color: #f8f8f8;
         padding: 10px;
         border-radius: 4px;
         overflow-x: auto;
       }
       ul, ol {
         margin-bottom: 15px;
         padding-left: 20px;
       }
     </style>
     <script type="application/javascript">
          var converter = new showdown.Converter()
          var url1 = "README.md" 
//           var url1 = "https://nullismeismeritis.github.io/README.md" 
     </script>
  </head>
  
  <body id="body">
     <div id="rendered">
     </div>
  </body>

  <script type="application/javascript" >
    $.ajax({
        url: 'README.md',
        type: 'get',
        success: function(data) {
            var rendered = converter.makeHtml(data) 
            $("#rendered").html( rendered )
        }
    });
  
  </script>

</html>
