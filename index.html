<!DOCTYPE html>
<html>
  <head>
     <script type="application/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/showdown/1.9.0/showdown.min.js"></script>
     <script type="application/javascript" src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
     <script type="application/javascript">
          var converter = new showdown.Converter()
          var url1 = "content.md" 
//           var url1 = "https://nullismeismeritis.github.io/README.md" 
     </script>
  </head>
  
  <body id="body">
     <div id="rendered">
     </div>
  </body>

  <script type="application/javascript" >
    $.ajax({
        url: 'content.md',
        type: 'get',
        success: function(data) {
            var rendered = converter.makeHtml(data) 
            $("#rendered").html( rendered )
        }
    });
  
  </script>

</html>
